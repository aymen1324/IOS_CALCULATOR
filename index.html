<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Hello, Localhost!</h1>
    <div class="calculator">

        <h1>iOS Calculator</h1>

        <div class="display">
            <input type="text" id="display" value="0" readonly>
        </div>

        <div class="buttons">

            <button class="light">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="operator">=</button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
